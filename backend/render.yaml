services:
  - type: web
    name: neet-tracker-api
    runtime: node
    plan: free
    region: singapore # Closest to India for ultra-low latency
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: neet-tracker-db
          property: connectionString

databases:
  - name: neet-tracker-db
    plan: free
    region: singapore
    ipAllowList: [] # Allow all internal connections
