services:
  - type: web
    name: neet-tracker-api
    runtime: node
    plan: free
    region: singapore # Low-latency for India
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
